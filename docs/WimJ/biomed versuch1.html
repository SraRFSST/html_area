<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<title>Organe Spiel</title>
<button onclick="resetGame()">🔄 Reset</button>
<style>
    button{
    padding:10px 20px;
    border:none;
    border-radius:10px;
    background:#6C63FF;
    color:white;
    font-weight:bold;
    cursor:pointer;
}

button:hover{
    background:#574fcf;
}
</style>
<style>

body{
    margin:0;
    font-family:Arial;
    background:#f0f3f8;
    text-align:center;
}

#wrap{
    display:flex;
    justify-content:center;
    gap:20px;
    padding:20px;
}

#organs{
    width:160px;
}

.organ{
    background:white;
    padding:10px;
    margin:10px;
    border:2px solid #555;
    border-radius:10px;
    cursor:grab;
}

#game{
    position:relative;
    width:520px;
}

#body{
    width:100%;
    display:block;
}

/* UNSICHTBARE FIX-PUNKTE */
.zone{
    position:absolute;
    opacity:0;
}

#status{
    font-size:20px;
    font-weight:bold;
}

</style>
</head>

<body>

<h1>🫀 Organe einsetzen</h1>

<div id="status">Ziehe die Organe in den Körper</div>

<div id="wrap">

<div id="organs">

<div class="organ" draggable="true" data-type="lungs">🫁 Lunge</div>
<div class="organ" draggable="true" data-type="heart">❤️ Herz</div>
<div class="organ" draggable="true" data-type="liver">🟤 Leber</div>
<div class="organ" draggable="true" data-type="stomach">🍽️ Magen</div>
<div class="organ" draggable="true" data-type="intestine">🧬 Darm</div>

</div>

<div id="game">

<img id="body" src="bild3.png">

<!-- RELATIVE POSITIONEN (PROZENT = FIX!) -->
<div class="zone" data-type="lungs" style="left:40%; top:22%; width:20%; height:15%;"></div>
<div class="zone" data-type="heart" style="left:48%; top:32%; width:10%; height:8%;"></div>
<div class="zone" data-type="liver" style="left:38%; top:45%; width:22%; height:12%;"></div>
<div class="zone" data-type="stomach" style="left:52%; top:45%; width:18%; height:12%;"></div>
<div class="zone" data-type="intestine" style="left:38%; top:58%; width:24%; height:25%;"></div>

</div>

</div>

<script>

const organs = document.querySelectorAll(".organ");
const zones = document.querySelectorAll(".zone");
const body = document.getElementById("body");
const status = document.getElementById("status");

let score = 0;

organs.forEach(o=>{
    o.addEventListener("dragstart", e=>{
        e.dataTransfer.setData("type", o.dataset.type);
    });
});

document.getElementById("game").addEventListener("dragover", e=>{
    e.preventDefault();
});

document.getElementById("game").addEventListener("drop", e=>{

    e.preventDefault();

    const type = e.dataTransfer.getData("type");

    const zone = [...zones].find(z => z.dataset.type === type);

    if(zone){

        document.querySelector(`[data-type="${type}"]`).style.display="none";

        score++;

        status.innerText = "✅ Richtig!";

        if(score === 5){
            body.src = "bild4.png";
            status.innerText = "🎉 Perfekt!";
        }

    } else {

        body.src = "bild5.png";
        status.innerText = "❌ Falsch!";

        setTimeout(()=>{
            if(score < 5) body.src = "bild3.png";
        },800);

    }

});

function resetGame(){

    score = 0;

    body.src = "bild3.png";

    status.innerText = "Ziehe die Organe in den Körper";

    document.querySelectorAll(".organ").forEach(o=>{
        o.style.display = "block";
    });

}

</script>

</body>
</html>
